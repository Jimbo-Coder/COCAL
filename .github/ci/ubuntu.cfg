# Cactus option list for the CI: Ubuntu's GCC and OpenMPI (apt), as on a
# GitHub-hosted runner.
VERSION = 2026-11-01
CPP = cpp
FPP = cpp
CC  = gcc
CXX = g++
F90 = gfortran
FPPFLAGS = -traditional
CFLAGS   = -std=gnu11
CXXFLAGS = -std=c++17 -D_GNU_SOURCE
F90FLAGS = -fcray-pointer -ffixed-line-length-none
LDFLAGS  = -rdynamic
DEBUG    = no
OPTIMISE = yes
C_OPTIMISE_FLAGS   = -O2
CXX_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2
WARN = yes
OPENMP           = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS  = -fopenmp
VECTORISE = no
PTHREADS_DIR = NO_BUILD
